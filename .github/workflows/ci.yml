name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    name: "Lint & Format Check"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "0.10.10"
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.14

    - name: Install dependencies
      run: make install

    - name: Check formatting and linting
      run: make lint

  type-check:
    runs-on: ubuntu-latest
    name: "Type Check"
    continue-on-error: true  # Advisory until zuban is green on the async refactor

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "0.10.10"
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.14

    - name: Install dependencies
      run: make install

    - name: Run type checking
      run: make typecheck

  test:
    runs-on: ubuntu-latest
    name: "Tests & Coverage (py${{ matrix.python-version }})"
    needs: [lint-and-format]  # Only run if linting passes

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "0.10.10"
        enable-cache: true

    - name: Set up Python
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: make install PYTHON_VERSION=${{ matrix.python-version }}

    - name: Install Redis CLI
      run: sudo apt-get update && sudo apt-get install -y redis-tools

    - name: Wait for Redis to be ready
      run: |
        timeout 30 bash -c 'until redis-cli -h localhost -p 6379 ping; do sleep 1; done'

    - name: Run tests with coverage
      run: make coverage-xml
      env:
        DJHTMX_REDIS_URL: redis://localhost:6379/0
