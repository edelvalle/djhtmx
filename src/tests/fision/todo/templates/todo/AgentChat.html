{% load htmx %}

<div {% hx-tag %} class="agent-chat">
  <h2 class="agent-chat-title">Ask the agent</h2>
  {# The viewport is the positioned wrapper; the scroller inside it is what moves. #}
  <div class="agent-chat-viewport">
    <div class="agent-chat-scroll">
      <ul class="agent-chat-log" id="agent-chat-log">
        {% for message in this.messages %}
          {% htmx 'AgentChatMessage' id=message.component_id message=message %}
        {% endfor %}
      </ul>
    </div>
    <button class="agent-chat-follow"
            type="button"
            hidden
            aria-label="Follow the newest message">
      <svg xmlns="http://www.w3.org/2000/svg"
           width="18"
           height="18"
           viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round"
           aria-hidden="true">
        <path d="M12 17V3" />
        <path d="m6 11 6 6 6-6" />
        <path d="M19 21H5" />
      </svg>
    </button>
  </div>
  <div class="agent-chat-form">
    <input class="agent-chat-prompt"
           name="prompt"
           placeholder="Tidy up my list, mark the groceries done…"
           {% on "keypress[key=='Enter']" "send" %} />
    <button class="agent-chat-send" type="button" aria-label="Send" {% on 'click' 'send' %}>
      <svg xmlns="http://www.w3.org/2000/svg"
           width="18"
           height="18"
           viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round"
           aria-hidden="true">
        <path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z" />
        <path d="m21.854 2.147-10.94 10.939" />
      </svg>
    </button>
  </div>
</div>
