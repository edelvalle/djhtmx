{% load static htmx %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }} • TodoMVC</title>
    <!-- CSS overrides - remove if you don't need it -->
    <link rel="stylesheet" href="{% static "todo.css" %}" />
    {% htmx-headers %}
  </head>
  <body hx-boost="true">
    {% htmx "SSEEventRouter" %}
    <section>
      {% block body %}
      {% endblock body %}

      <!-- This footer should hidden bby default and shown when there are todos -->
    </section>
    <a></a>
  </body>
</html>
